{% extends "base.html" %}
{% block title %}管理仪表盘{% endblock %}
{% block content %}
<div class="card">
    <h2>管理后台</h2>
    <p>欢迎回来，管理员 {{ current_user.username }}</p>
    <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
        <a href="{{ url_for('admin.users') }}" class="btn">用户管理</a>
        <a href="{{ url_for('admin.posts') }}" class="btn">帖子管理</a>
    </div>
    <hr>
    <h3>统计信息</h3>
    <ul>
        <li>用户总数：{{ user_count }}</li>
        <li>帖子总数：{{ post_count }}</li>
        <li>评论总数：{{ comment_count }}</li>
    </ul>
</div>
{% endblock %}
