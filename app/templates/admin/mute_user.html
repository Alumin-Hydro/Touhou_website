{% extends "base.html" %}
{% block title %}禁言用户{% endblock %}
{% block content %}
<div class="card">
    <h2>禁言用户: {{ user.username }}</h2>
    <form method="post">
        <div class="form-group">
            <label>禁言时长</label>
            <select name="duration" required>
                <option value="permanent">永久禁言</option>
                <option value="1">1 小时</option>
                <option value="6">6 小时</option>
                <option value="12">12 小时</option>
                <option value="24">1 天</option>
                <option value="48">2 天</option>
                <option value="168">7 天</option>
            </select>
        </div>
        <button type="submit" class="btn">确认禁言</button>
        <a href="{{ url_for('admin.users') }}" class="btn">取消</a>
    </form>
</div>
{% endblock %}
