{% extends "base.html" %}
{% block title %}找回密码 - 东方观鸟论坛——幻想博物志{% endblock %}
{% block content %}
<div class="card auth-card">
    <h2>🔑 找回密码</h2>
    <p style="color:#7a6a5a; margin-bottom:1rem;">输入注册时使用的邮箱，我们会发送一个重置密码的链接给你。</p>
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label>电子邮箱</label>
            <input type="email" name="email" required>
        </div>
        <button type="submit">📧 发送重置链接</button>
    </form>
    <p style="margin-top:1rem;"><a href="{{ url_for('auth.login') }}">返回登录</a></p>
</div>
{% endblock %}
