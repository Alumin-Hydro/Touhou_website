{% extends "base.html" %}
{% block title %}登录 - 东方观鸟论坛{% endblock %}
{% block content %}
<div class="card auth-card">
    <h2>🔐 登录论坛</h2>
    <form method="post">
        <div class="form-group">
            <label>用户名</label>
            <input type="text" name="username" required>
        </div>
        <div class="form-group">
            <label>密码</label>
            <input type="password" name="password" required>
        </div>
        <button type="submit">🌸 进入幻想乡</button>
    </form>
    <p style="margin-top:1rem;">未注册？ <a href="{{ url_for('auth.register') }}">立即注册</a></p>
</div>
{% endblock %}
